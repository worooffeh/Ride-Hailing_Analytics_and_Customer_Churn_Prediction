version: 0.2

env:
  variables:
    PYTHON_VERSION: "3.12"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo Installing pip and project requirements
      - python -m pip install --upgrade pip
      - pip install -r requirements.txt

  pre_build:
    commands:
      - echo Pre-build: install dev tools and lint
      - pip install flake8 || true
      - flake8 src || true

  build:
    commands:
      - echo Build: run tests
      - pip install pytest || true
      - pytest -q || true
      - echo Build finished

  post_build:
    commands:
      - echo Packaging artifacts
      - mkdir -p artifacts
      - cp -r src models requirements.txt mlruns artifacts || true

artifacts:
  files:
    - artifacts/**/*
  discard-paths: no

cache:
  paths:
    - '/root/.cache/pip/**/*'
