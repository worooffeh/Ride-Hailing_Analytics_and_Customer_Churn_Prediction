#---------------------------------------------------------------------------
# Nginx reverse proxy for RideWise (FastAPI + Streamlit)
#---------------------------------------------------------------------------
# Usage:
#   - Place this file in /etc/nginx/conf.d/ridewise.conf (or sites-available/)
#   - Adjust server_name to your domain
#   - Set up SSL with Let's Encrypt (certbot)
#   - Reload: nginx -t && nginx -s reload
#---------------------------------------------------------------------------

upstream ridewise_api {
    server api:8000;
}

upstream ridewise_ui {
    server ui:8501;
}

#---------------------------------------------------------------------------
# HTTP → HTTPS redirect (optional, uncomment after SSL setup)
#---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ridewise.example.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

#---------------------------------------------------------------------------
# HTTPS server block (main)
#---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ridewise.example.com;

    # SSL certificates (set up with Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/ridewise.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ridewise.example.com/privkey.pem;

    # Modern SSL configuration (A+ rating)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/ridewise-access.log;
    error_log /var/log/nginx/ridewise-error.log warn;

    # Client upload size limit
    client_max_body_size 100M;

    #=========================================================================
    # Proxy to FastAPI (scoring service)
    #=========================================================================
    location /api/ {
        proxy_pass http://ridewise_api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 24 4k;
    }

    # FastAPI OpenAPI docs (optional: restrict to admin only)
    location /api/docs {
        proxy_pass http://ridewise_api/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/openapi.json {
        proxy_pass http://ridewise_api/openapi.json;
        proxy_set_header Host $host;
    }

    #=========================================================================
    # Proxy to Streamlit (dashboard)
    #=========================================================================
    location / {
        proxy_pass http://ridewise_ui;
        proxy_http_version 1.1;

        # WebSocket support (Streamlit uses WebSockets for real-time updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffering (disable for streaming)
        proxy_buffering off;
    }

    # Streamlit static assets (cache aggressively)
    location ~* ^/_app/static/.*\.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        proxy_pass http://ridewise_ui;
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    #=========================================================================
    # Health checks (for monitoring)
    #=========================================================================
    location /health {
        access_log off;
        proxy_pass http://ridewise_api/health;
        proxy_set_header Host $host;
    }

    #=========================================================================
    # Deny suspicious paths
    #=========================================================================
    location ~ /\.git {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}
